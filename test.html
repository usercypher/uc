<!DOCTYPE html>
<html>
<body>
<pre id="out">Loading...</pre>
<script>
(function () {
    function strip_tag_custom(html, allowedTags) {
        var out = '';
        var i = 0;
        var len = html.length;
        var lt, gt, raw, closing, name, lower, p, v, e, u, ok, c, j, o, m, pp, sch, close;
        var marks, st, en, k, found, cspn, ch, q;

        while (true) {
            lt = html.indexOf('<', i);
            if (lt === -1) break;
            out += html.substring(i, lt);

            gt = lt + 1;
            q = null;
            while (gt < len) {
                ch = html.charAt(gt);
                if (q !== null) {
                    if (ch === q) q = null;
                } else if (ch === '"' || ch === "'") {
                    q = ch;
                } else if (ch === '>') {
                    break;
                }
                gt++;
            }
            if (gt >= len) { out += '&lt;' + html.substring(lt + 1); i = len; break; }

            raw = html.substring(lt + 1, gt);
            i = gt + 1;

            closing = (raw.length > 0 && raw.charAt(0) === '/');
            if (closing) raw = raw.substring(1);

            cspn = raw.length;
            for (k = 0; k < raw.length; k++) {
                ch = raw.charAt(k);
                if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r' || ch === '/') { cspn = k; break; }
            }
            name = raw.substring(0, cspn).toLowerCase();

            found = false;
            for (k in allowedTags) {
                if (allowedTags.hasOwnProperty(k) && k === name) { found = true; break; }
            }
            if (!found) continue;
            if (closing) { out += '<\/' + name + '>'; continue; }

            lower = raw.toLowerCase();
            out += '<' + name;

            var allowHref = false;
            for (k = 0; k < allowedTags[name].length; k++) {
                if (allowedTags[name][k] === 'href') { allowHref = true; break; }
            }
            if (allowHref && (p = lower.indexOf(' href=')) !== -1) {
                v = raw.substring(p + 6);
                st = 0;
                while (st < v.length && (v.charAt(st) === ' ' || v.charAt(st) === '\t' || v.charAt(st) === '\n' || v.charAt(st) === '\r')) st++;
                v = v.substring(st);
                if (v.length > 0) {
                    if (v.charAt(0) === '"' || v.charAt(0) === "'") {
                        e = v.indexOf(v.charAt(0), 1);
                        v = (e === -1) ? false : v.substring(1, e);
                    } else {
                        cspn = v.length;
                        for (k = 0; k < v.length; k++) {
                            ch = v.charAt(k);
                            if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') { cspn = k; break; }
                        }
                        v = v.substring(0, cspn);
                    }
                } else { v = false; }
                if (v !== false) {
                    u = v;
                    var search = ['&#58;', '&#x3A;', '&#x3a;', '&colon;', '&Tab;', '&NewLine;', '&#9;', '&#x9;', '&#10;', '&#xA;', '&#x10;', '&#13;', '&#xD;', '&#x13;'];
                    var repl   = [':', ':', ':', ':', '\t', '\n', '\t', '\t', '\n', '\n', '\n', '\r', '\r', '\r'];
                    for (k = 0; k < search.length; k++) {
                        while (u.indexOf(search[k]) !== -1) u = u.replace(search[k], repl[k]);
                    }
                    st = 0;
                    while (st < u.length && (u.charAt(st) === ' ' || u.charAt(st) === '\t' || u.charAt(st) === '\n' || u.charAt(st) === '\r' || u.charAt(st) === '\0' || u.charAt(st) === '\x0B')) st++;
                    u = u.substring(st);
                    ok = (u.length > 0 && u.substring(0, 2) !== '//');
                    if (ok) {
                        for (j = 0; j < u.length; j++) {
                            o = u.charCodeAt(j);
                            if (o < 0x20 || o === 0x7F) { ok = false; break; }
                        }
                    }
                    if (ok) {
                        c = u.indexOf(':');
                        if (c !== -1) {
                            ok = false;
                            marks = ['/', '?', '#'];
                            for (m = 0; m < marks.length; m++) {
                                pp = u.indexOf(marks[m]);
                                if (pp !== -1 && pp < c) { ok = true; break; }
                            }
                            if (!ok) {
                                sch = u.substring(0, c).toLowerCase();
                                ok = (sch === 'http' || sch === 'https' || sch === 'mailto');
                            }
                        }
                    }
                    if (ok) {
                        var esc = '';
                        for (k = 0; k < v.length; k++) {
                            ch = v.charAt(k);
                            if (ch === '&') esc += '&amp;';
                            else if (ch === '<') esc += '&lt;';
                            else if (ch === '>') esc += '&gt;';
                            else if (ch === '"') esc += '&quot;';
                            else esc += ch;
                        }
                        out += ' href="' + esc + '"';
                    }
                }
            }

            var allowStyle = false;
            for (k = 0; k < allowedTags[name].length; k++) {
                if (allowedTags[name][k] === 'style') { allowStyle = true; break; }
            }
            if (allowStyle && (p = lower.indexOf(' style=')) !== -1) {
                v = raw.substring(p + 7);
                st = 0;
                while (st < v.length && (v.charAt(st) === ' ' || v.charAt(st) === '\t' || v.charAt(st) === '\n' || v.charAt(st) === '\r')) st++;
                v = v.substring(st);
                if (v.length > 0) {
                    if (v.charAt(0) === '"' || v.charAt(0) === "'") {
                        e = v.indexOf(v.charAt(0), 1);
                        v = (e === -1) ? false : v.substring(1, e);
                    } else {
                        cspn = v.length;
                        for (k = 0; k < v.length; k++) {
                            ch = v.charAt(k);
                            if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') { cspn = k; break; }
                        }
                        v = v.substring(0, cspn);
                    }
                } else { v = false; }
                if (v !== false) {
                    v = v.toLowerCase();
                    while ((p = v.indexOf('url(')) !== -1) {
                        close = v.indexOf(')', p);
                        if (close === -1) { v = v.substring(0, p); break; }
                        v = v.substring(0, p) + v.substring(close + 1);
                    }
                    var bad = ['@import', 'expression', 'javascript', 'behavior', '-moz-binding', '\\', '/*', '*/', 'position', 'z-index', 'opacity', 'transform', 'filter'];
                    for (k = 0; k < bad.length; k++) {
                        while (v.indexOf(bad[k]) !== -1) v = v.replace(bad[k], '');
                    }
                    var sp = [' ;', ' ,', ' :'], rp = [';', ',', ':'];
                    for (k = 0; k < sp.length; k++) {
                        while (v.indexOf(sp[k]) !== -1) v = v.replace(sp[k], rp[k]);
                    }
                    while (v.indexOf('  ') !== -1) v = v.replace('  ', ' ');
                    st = 0; en = v.length;
                    while (st < en && (v.charAt(st) === ' ' || v.charAt(st) === '\t' || v.charAt(st) === '\n' || v.charAt(st) === '\r')) st++;
                    while (en > st && (v.charAt(en - 1) === ' ' || v.charAt(en - 1) === '\t' || v.charAt(en - 1) === '\n' || v.charAt(en - 1) === '\r')) en--;
                    v = v.substring(st, en);
                    if (v.length > 0) {
                        var esc2 = '';
                        for (k = 0; k < v.length; k++) {
                            ch = v.charAt(k);
                            if (ch === '&') esc2 += '&amp;';
                            else if (ch === '<') esc2 += '&lt;';
                            else if (ch === '>') esc2 += '&gt;';
                            else if (ch === '"') esc2 += '&quot;';
                            else esc2 += ch;
                        }
                        out += ' style="' + esc2 + '"';
                    }
                }
            }

            out += '>';
        }
        out += html.substring(i);
        return out;
    }

    var outEl = document.getElementById('out');
    var lines = [];
    try {
        var allow = { a: ['href'], b: [], i: [], span: ['style'], div: ['style', 'href'] };
        var tests = [
            ['<a href="https://example.com">ok<\/a>', '<a href="https://example.com">ok<\/a>'],
            ['<a href="http://x.com/path?q=1#frag">ok<\/a>', '<a href="http://x.com/path?q=1#frag">ok<\/a>'],
            ['<a href="mailto:a@b.com">mail<\/a>', '<a href="mailto:a@b.com">mail<\/a>'],
            ['<a href="/relative/path">rel<\/a>', '<a href="/relative/path">rel<\/a>'],
            ['<a href="foo/bar:baz">rel-colon<\/a>', '<a href="foo/bar:baz">rel-colon<\/a>'],
            ['<a href="javascript:alert(1)">bad<\/a>', '<a>bad<\/a>'],
            ['<a href="JAVASCRIPT:alert(1)">bad<\/a>', '<a>bad<\/a>'],
            ['<a href=" javascript:alert(1)">bad<\/a>', '<a>bad<\/a>'],
            ['<a href="java&#58;script:alert(1)">bad<\/a>', '<a>bad<\/a>'],
            ['<a href="java&#x3A;script:alert(1)">bad<\/a>', '<a>bad<\/a>'],
            ['<a href="java&colon;script:alert(1)">bad<\/a>', '<a>bad<\/a>'],
            ['<a href="//evil.com">bad<\/a>', '<a>bad<\/a>'],
            ['<a href="data:text/html,x">bad<\/a>', '<a>bad<\/a>'],
            ['<a href="vbscript:x">bad<\/a>', '<a>bad<\/a>'],
            ['<a href="java&#9;script:x">bad<\/a>', '<a>bad<\/a>'],
            ['<a href="https://ok.com" onclick="evil()">x<\/a>', '<a href="https://ok.com">x<\/a>'],
            ['<a href="https://ok.com" href="javascript:x">x<\/a>', '<a href="https://ok.com">x<\/a>'],
            ['<a data-href="javascript:x" href="https://ok.com">x<\/a>', '<a href="https://ok.com">x<\/a>'],
            ['<div onclick="x"><b>Bold<\/b><\/div>', '<div><b>Bold<\/b><\/div>'],
            ['<div><b>Hi<\/b> <i>there<\/i><\/div>', '<div><b>Hi<\/b> <i>there<\/i><\/div>'],
            ['<script>alert(1)<\/script>', 'alert(1)'],
            ['<span style="color:red">red<\/span>', '<span style="color:red">red<\/span>'],
            ['<span style="background:url(javascript:x); color:blue">x<\/span>', '<span style="background:; color:blue">x<\/span>'],
            ['<span style="position:fixed; color:red">x<\/span>', '<span style=":fixed; color:red">x<\/span>'],
            ['<span style="u\\72l(evil)">x<\/span>', '<span style="u72l(evil)">x<\/span>'],
            ['<span style="/* x */ color:red">x<\/span>', '<span style="x color:red">x<\/span>'],
            ['<span style="@import url(x); color:red">x<\/span>', '<span style="; color:red">x<\/span>'],
            ['<span style="expression(alert(1)); color:red">x<\/span>', '<span style="(alert(1)); color:red">x<\/span>'],
            ['<a>no href<\/a>', '<a>no href<\/a>'],
            ['plain text', 'plain text'],
            ['a < b', 'a &lt; b'],
            ['<a href="https://x.com"><b>mix<\/b><\/a>', '<a href="https://x.com"><b>mix<\/b><\/a>'],
            ['<A HREF="https://x.com">caps<\/A>', '<a href="https://x.com">caps<\/a>'],
            ['<a title="1 > 0" href="https://x.com">t<\/a>', '<a href="https://x.com">t<\/a>'],
            ['<a title=">" href="https://x.com">t<\/a>', '<a href="https://x.com">t<\/a>'],
            ['<a href="https://x.com?a=1&amp;b=>2">h<\/a>', '<a href="https://x.com?a=1&amp;amp;b=&gt;2">h<\/a>'],
            ['<span style="color:red" data-x="a>b">s<\/span>', '<span style="color:red">s<\/span>'],
            ["<a title='a>b' href=\"https://x.com\">q<\/a>", '<a href="https://x.com">q<\/a>']
        ];

        var pass = 0, fail = 0;
        for (var n = 0; n < tests.length; n++) {
            var got = strip_tag_custom(tests[n][0], allow);
            if (got === tests[n][1]) {
                pass++;
                lines.push('PASS #' + n);
            } else {
                fail++;
                lines.push('FAIL #' + n);
                lines.push('  input:    ' + tests[n][0]);
                lines.push('  expected: ' + tests[n][1]);
                lines.push('  got:      ' + got);
            }
        }
        lines.unshift('JS: ' + pass + ' passed, ' + fail + ' failed\n');
    } catch (err) {
        lines.push('ERROR: ' + err.message);
        lines.push('Stack: ' + (err.stack || '(no stack)'));
    }
    outEl.innerHTML = '';
    outEl.appendChild(document.createTextNode(lines.join('\n')));
})();
</script>
</body>
</html>
